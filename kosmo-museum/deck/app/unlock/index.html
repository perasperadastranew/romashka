<script type="module">

[...forms.children].forEach((x) => x.classList.toggle('on', x.dataset.f === FORM));

[['a', 'Лежит → зум'], ['b', 'Наклон → сразу']].forEach(([k, n]) => { const b = document.createElement('button'); b.textContent = n; b.dataset.v = k; b.onclick = () => { VAR = k; [...vars.children].forEach((x) => x.classList.toggle('on', x.dataset.v === VAR)); window.play(cur); }; vars.appendChild(b); });
[...vars.children].forEach((x) => x.classList.toggle('on', x.dataset.v === VAR));

[...metals.children].forEach((x) => x.classList.toggle('on', x.dataset.m === METAL));

[...mats.children].forEach((x) => x.classList.toggle('on', x.dataset.m === MAT));
