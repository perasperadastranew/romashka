<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
@font-face{font-family:"Cygre";src:url("fonts/Cygre-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Cygre";src:url("fonts/Cygre-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
/* Layout: a fixed isometric WebGL stage; text lives in one small card per screen (lower left),
   a pill row of the nine houses sits at the bottom. Single light look by choice. */
:root{
  color-scheme:light;
  --bg:#e9f0f1;
  --card:#ffffff;
  --ink:#1c211f;
  --dim:#6d7773;
  --line:#dfe5e3;
  --accent:#e4502f;
  --mint:#58b892;
  --display:"Cygre","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(16px,3.2vw,44px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow-x:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
.bar{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gutter) 14px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.brand{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--card);background:var(--accent);padding:6px 12px;border-radius:8px}
#count{font-variant-numeric:tabular-nums;background:var(--card);padding:6px 12px;border-radius:999px;color:var(--ink)}
main{position:static}
section{min-height:100vh;min-height:100svh;padding-inline:var(--gutter);padding-block:88px 92px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
.card{background:var(--card);border-radius:14px;padding:22px 22px 20px;max-width:min(340px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line),0 18px 40px -22px rgba(28,33,31,.35)}
.card h1,.card h2{font-family:var(--display);font-weight:500;font-size:clamp(22px,2.3vw,28px);line-height:1.12;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--dim);font-size:14px}
.num{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-variant-numeric:tabular-nums}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--dim);font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.state{font-family:var(--mono);font-size:11px;color:var(--dim)}
.state:empty{display:none}
.btn{align-self:flex-start;border:0;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--card);background:var(--accent);padding:8px 14px;border-radius:999px;text-decoration:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 var(--gutter) calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none}
.nav ol{list-style:none;margin:0;padding:6px;display:flex;gap:4px;overflow-x:auto;max-width:100%;width:max-content;background:var(--card);border-radius:999px;pointer-events:auto;box-shadow:0 12px 30px -18px rgba(28,33,31,.4);scrollbar-width:none}
.nav ol::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--dim);text-decoration:none;padding:7px 12px;border-radius:999px}
.nav a[aria-current="true"]{background:var(--accent);color:var(--card)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wx{display:flex;gap:2px;background:var(--card);border-radius:999px;padding:3px;margin-left:auto}
.wx button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--dim);background:transparent;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
.wx button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
#stage{filter:saturate(1.12) contrast(1.03)}
.ts{position:fixed;left:0;right:0;z-index:0;pointer-events:none;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.ts-top{top:0;height:30%;-webkit-mask-image:linear-gradient(to bottom,#000 10%,transparent);mask-image:linear-gradient(to bottom,#000 10%,transparent)}
.ts-bot{bottom:0;height:24%;-webkit-mask-image:linear-gradient(to top,#000 10%,transparent);mask-image:linear-gradient(to top,#000 10%,transparent)}
#wxc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.pins{position:fixed;inset:0;z-index:1;pointer-events:none}
.card{position:relative;z-index:2}
.pin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--ink);background:var(--card);border-radius:999px;padding:4px 10px 4px 4px;text-decoration:none;white-space:nowrap;box-shadow:0 8px 20px -12px rgba(28,33,31,.5);pointer-events:auto;will-change:transform}
.pin b{font-weight:400;color:var(--card);background:var(--accent);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pin::after{content:"";position:absolute;left:13px;top:100%;width:1px;height:14px;background:var(--accent)}
@media (max-width:760px){ .pin span{display:none} .pin{padding:4px}
 section{padding-block:76px 84px} .card{padding:18px} }
/* each lot pins its card for a while, the camera holds on the house, then moves on */
section{display:block;min-height:0;height:190vh;height:190svh;padding:0}
.pw{position:sticky;top:0;height:100vh;height:100svh;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:88px var(--gutter) 92px}
@media (max-width:760px){ .pw{padding:76px var(--gutter) 84px} }
/* desktop: bigger card */
@media (min-width:761px){
 .card{max-width:min(400px,100%);min-height:min(560px,calc(100svh - 200px));padding:44px 40px 40px;gap:20px;border-radius:22px}
 .card .num{margin-bottom:6px}
 .card p{line-height:1.6}
 .card .meta,.card>.facts{margin-top:auto;padding-top:18px}
 .card .facts+.state,.card .meta+.btn{margin-top:4px}
 .card h1,.card h2{font-size:clamp(28px,2.6vw,38px)}
 .card p{font-size:16px}
 .num,.meta,.state{font-size:12.5px}
 .btn{font-size:12.5px;padding:10px 18px}
 .facts li{font-size:12.5px;padding:6px 12px}
 .logo{width:60px;height:60px} .logo .daisy{width:44px;height:44px}
}
@media (max-width:480px){ #count{display:none} }
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.card h1{font-family:var(--display);font-weight:500;letter-spacing:-.015em;line-height:1.1}
.brand{display:inline-flex;align-items:center;gap:7px}
.brand .daisy{width:18px;height:18px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center}
.logo .daisy{width:38px;height:38px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 0;padding:0;list-style:none}
.facts li{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--ink);background:var(--bg);border-radius:999px;padding:5px 10px}
main{cursor:pointer}
.card{cursor:auto}
</style>

</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<canvas id="wxc" aria-hidden="true"></canvas>

  <span class="wx" role="group" aria-label="Погода"><button type="button" id="wx-sun" data-wx="sun" aria-pressed="true">Ясно</button><button type="button" id="wx-rain" data-wx="rain" aria-pressed="false">Дождь</button><button type="button" id="wx-snow" data-wx="snow" aria-pressed="false">Снег</button></span>

</div>

<main id="main">
  <section id="top" data-st="0">
    <div class="card">
      <div class="logo"><svg class="daisy" viewBox="0 0 40 40" aria-hidden="true"><g fill="#fff"><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(0 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(30 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(60 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(90 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(120 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(150 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(180 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(210 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(240 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(270 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(300 20 20)"/><ellipse cx="20" cy="9.5" rx="4.2" ry="8.5" transform="rotate(330 20 20)"/></g><circle cx="20" cy="20" r="6.2" fill="#ffc94a"/><circle cx="18" cy="18.2" r="1.6" fill="#fff" opacity=".55"/></svg></div>
      <div class="num">9 лотов · сдан давно</div>
      <h1>Коттеджный посёлок «Ромашковая долина»</h1>
      <p>Девять домов и ни одного соседа сверху. До моря пять минут качения, до леса ноль.</p>
      <ul class="facts"><li>9 домов на 5,5 га</li><li>лес в шаговой доступности</li><li>парковки нет, машин тоже</li></ul>
      <div class="state" id="loadState">Генплан загружается…</div>
    </div>
  </section>
</main>

<div class="pins" id="pins"></div>

<nav class="nav" aria-label="Лоты"><ol id="navList"></ol></nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const HOUSES=[{"file":"ForestHouse","short":"Шалаш","name":"Шалаш-студия в лесу","text":"Свободная планировка: стен нет, есть скаты. Мох на крыше входит в стоимость и растёт бесплатно.","meta":"Вид на звёзды · отделка: брёвна","btn":"Покрутить телескоп","min":[-99.87,-0.24,15.24],"max":[-87.74,7.42,30.15],"x":-93.8,"z":24.85,"y":0.0,"rot":0.4363,"parts":[{"id":"telescope","p":[-3.2,1.05,1.4],"ax":[0,1,0],"mode":"kick","a":0.5,"w":0.5}]},{"file":"PinkHouse","short":"Розовый","name":"Розовый дом с палисадником","text":"Видовое жильё в один этаж. Дым над трубой завивается сам, ромашка на двери крутится по требованию.","meta":"Двор без машин · забор по периметру","btn":"Крутануть ромашку","min":[-80.74,-0.2,-15.2],"max":[-68.01,5.6,-4.51],"x":-74.55,"z":-10.15,"y":0.0,"rot":0.3491,"parts":[{"id":"daisy","p":[0.0,1.061,1.758],"ax":[0,0,1],"mode":"spin","a":0.5,"w":0}]},{"file":"StoneHouse","short":"Каменный","name":"Каменный особняк","text":"Толстые стены и плющ вместо фасадной подсветки. Сердце на кронштейне служит единственной вывеской в посёлке.","meta":"Ручей у крыльца · шпили: 2 шт.","btn":"Качнуть сердце","min":[-47.84,-0.35,-55.25],"max":[-33.63,5.94,-46.15],"x":-39.55,"z":-50.4,"y":0.0,"rot":0.1745,"parts":[{"id":"heart","p":[1.908,3.48,-0.067],"ax":[1,0,0],"mode":"swing","a":0.22,"w":1.8}]},{"file":"TreeHouse","short":"На клёне","name":"Пентхаус на клёне","text":"Самый высокий этаж в долине. Лифта нет, зато есть лестница вверх и горка вниз.","meta":"Потолки до кроны · круговая терраса","btn":"Развернуть флаг","min":[43.35,-2.81,-76.02],"max":[52.46,8.08,-66.88],"x":47.95,"z":-71.4,"y":0.0,"rot":0.55,"parts":[{"id":"flag","p":[0.1,7.2,-0.0],"ax":[0,1,0],"mode":"kick","a":0.45,"w":0.9}]},{"file":"MillHouse","short":"Мельница","name":"Лофт в мельнице","text":"Бывшее производственное здание. Лопасти работают как вентиляция и как достопримечательность.","meta":"Центр долины · дощатый настил","btn":"Раскрутить лопасти","min":[1.04,-0.04,0.57],"max":[5.19,5.78,3.9],"x":2.45,"z":2.1,"y":0.0,"rot":-0.3491,"parts":[{"id":"blades","p":[0,3.78,0.6],"ax":[0,0,1],"mode":"spin","a":0.9,"w":0}]},{"file":"DomeHouse","short":"Купол","name":"Дом-купол с огородом","text":"Ни одного угла: пыли негде прятаться. Морковь на грядке включена в договор.","meta":"Яблоня, груша, апельсин · мост через ручей","btn":"Проверить морковь","min":[25.22,-1.4,17.19],"max":[33.89,3.85,25.7],"x":30.45,"z":21.35,"y":0.0,"rot":-0.1745,"parts":[{"id":"carrots","p":[-3.8,0.06,0.9],"ax":[0,1,0],"mode":"bob","a":0.1,"w":2.2}]},{"file":"JunkHouse","short":"Батисфера","name":"Батисфера на сваях","text":"Жильё для тех, кто всё чинит сам. Вентиль крутится, часы идут, остальное в процессе.","meta":"Первая линия · состояние творческое","btn":"Крутить вентиль","min":[72.18,-0.05,44.4],"max":[78.09,5.65,48.46],"x":74.2,"z":45.85,"y":0.1,"rot":-0.6109,"parts":[{"id":"valve","p":[0.0,2.599,1.497],"ax":[0,0,1],"mode":"spin","a":0.7,"w":0},{"id":"hand","p":[0.0,3.89,1.061],"ax":[0,0,1],"mode":"spin","a":-1.6,"w":0}]},{"file":"LogHouse","short":"Сруб","name":"Сруб под соломой","text":"Экологичнее некуда: брёвна, солома и тыква под коньком. Сарай и вилы идут бонусом.","meta":"Участок с забором · две яблони","btn":"Качнуть тыкву","min":[-34.94,-0.25,66.81],"max":[-19.92,5.54,77.18],"x":-27.3,"z":73.85,"y":0.0,"rot":0.0873,"parts":[{"id":"pumpkin","p":[0.5,4.051,2.2],"ax":[0,0,1],"mode":"swing","a":0.16,"w":1.6}]},{"file":"BlueHouse","short":"С колоннами","name":"Особняк с колоннами","text":"Классика: портик, балюстрада, венок над входом. Для тех, кому важны статус и скамейка у пруда.","meta":"Пруд с отмелью · фонарь у дорожки","btn":"Крутануть венок","min":[-49.4,-0.36,31.92],"max":[-32.58,7.34,44.1],"x":-41.3,"z":40.6,"y":0.0,"rot":0.0,"parts":[{"id":"wreath","p":[0.0,3.9,0.87],"ax":[0,0,1],"mode":"spin","a":0.4,"w":0}]}];
const main=document.getElementById('main'), navList=document.getElementById('navList');
HOUSES.forEach((h,i)=>{
  const s=document.createElement('section'); s.dataset.st=i+1; s.id=h.file.toLowerCase();
  s.innerHTML='<div class="card"><div class="num">Лот '+String(i+1).padStart(2,'0')+' / 09</div><h2>'+h.name+'</h2><p>'+h.text+'</p>'+
    '<div class="meta">'+h.meta+'</div><button class="btn" type="button" id="act-'+h.file.toLowerCase()+'" data-act="'+i+'">'+h.btn+' ↻</button><div class="state" data-h="'+i+'">Дом загружается…</div></div>';
  main.appendChild(s);
  const pin=document.createElement('a'); pin.className='pin'; pin.href='#'+s.id; pin.innerHTML='<b>'+(i+1)+'</b><span>'+h.short+'</span>'; document.getElementById('pins').appendChild(pin); h.pin=pin;
  const li=document.createElement('li'); li.innerHTML='<a href="#'+s.id+'">'+h.short+'</a>'; navList.appendChild(li);
});
const outro=document.createElement('section'); outro.dataset.st=HOUSES.length+1; outro.id='all';
outro.innerHTML='<div class="card"><div class="num">Отдел продаж закрыт</div><h2>Все лоты давно заняты</h2><p>Ипотека не предусмотрена, очереди тоже. Можно только смотреть и крутить.</p><a class="btn" href="#top">На генплан ↑</a></div>';
main.appendChild(outro);
const sections=[...document.querySelectorAll('section')], N=sections.length;
sections.forEach(s=>{ const w=document.createElement('div'); w.className='pw'; while(s.firstChild) w.appendChild(s.firstChild); s.appendChild(w); });
const navLinks=[...navList.querySelectorAll('a')];
const countEl=document.getElementById('count'), loadEl=document.getElementById('loadState');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas=document.getElementById('stage');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false}); }

const FX=[], R=()=>Math.random(), V3=THREE.Vector3;
const std=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:1,metalness:0},o||{}));
function tex(draw){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); draw(g); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t; }

function emitter(h,c){
  const ps=[]; for(let i=0;i<c.n;i++){ const o=c.make(i); o.visible=false; h.group.add(o); ps.push({o,age:1,life:1,v:new V3(),ph:R()*6.28}); }
  let acc=R();
  const fire=()=>{ const p=ps.find(p=>p.age>=p.life); if(!p) return; p.age=0; p.life=c.life*(.8+R()*.4); p.o.visible=true; c.spawn(p); };
  FX.push({h,burst:m=>{ for(let i=0;i<m;i++) fire(); },update(dt,t){ if(!reduce){ acc+=dt*c.rate; while(acc>=1){ acc-=1; fire(); } }
    for(const p of ps){ if(p.age>=p.life){ p.o.visible=false; continue; } p.age+=dt; c.step(p,dt,Math.min(1,p.age/p.life),t); } }});
}
const puffGeo=new THREE.IcosahedronGeometry(0.2,1), paperGeo=new THREE.IcosahedronGeometry(0.13,0), sparkGeo=new THREE.SphereGeometry(0.045,6,4);
function puffs(h,pos,rate){ emitter(h,{n:8,rate:rate||0.9,life:3.2,make:()=>new THREE.Mesh(puffGeo,std(0xffffff,{transparent:true,depthWrite:false})),
  spawn:p=>{ p.o.position.set(pos[0]+(R()-.5)*.1,pos[1],pos[2]+(R()-.5)*.1); p.v.set((R()-.5)*.2,.5+R()*.2,(R()-.5)*.2); },
  step:(p,dt,k)=>{ p.o.position.addScaledVector(p.v,dt); p.o.scale.setScalar(.5+k*1.7); p.o.material.opacity=(1-k)*.9; }}); }
function papers(h,pos){ emitter(h,{n:10,rate:0.55,life:5,make:()=>{ const m=new THREE.Mesh(paperGeo,std(0xffffff,{flatShading:true})); m.castShadow=true; return m; },
  spawn:p=>{ p.o.position.fromArray(pos); p.v.set((R()-.5)*2.6,2.4+R()*1.4,1.6+R()*1.8); },
  step:(p,dt,k)=>{ if(p.o.position.y>0.13||p.v.y>0){ p.v.y-=7*dt; p.o.position.addScaledVector(p.v,dt); p.o.rotation.x+=dt*6; p.o.rotation.z+=dt*4; } else p.o.position.y=0.13; p.o.scale.setScalar(k>.85?(1-k)/.15:1); }}); }
function floaters(h,pos,texs,o){ emitter(h,{n:8,rate:o.rate,life:o.life,make:i=>new THREE.Sprite(new THREE.SpriteMaterial({map:texs[i%texs.length],transparent:true,depthWrite:false})),

function sparks(h,pos){ emitter(h,{n:14,rate:5,life:0.6,make:()=>new THREE.Mesh(sparkGeo,new THREE.MeshBasicMaterial({color:0xf5a623})),

// Winged things: two flat wings on a hinge, flying a loop around a point.
function flyers(h,c,o){ const list=[];
  for(let i=0;i<o.n;i++){ const g=new THREE.Group(), wings=[]; const mat=std(o.colors[i%o.colors.length],{side:THREE.DoubleSide});
    for(const s of [-1,1]){ const hinge=new THREE.Group(); const w=new THREE.Mesh(new THREE.PlaneGeometry(o.w,o.d),mat); w.rotation.x=-Math.PI/2; w.position.x=s*o.w/2; w.castShadow=!!o.shadow; hinge.add(w); g.add(hinge); wings.push([hinge,s]); }
    if(o.body){ const b=new THREE.Mesh(sparkGeo,std(o.body)); b.scale.set(1.2,1.2,2.6); g.add(b); }
    h.group.add(g); list.push({g,wings,ph:i*2.1+R(),sp:o.speed*(.8+R()*.4),r:o.r*(.7+R()*.5)}); }
  let boost=0;
  FX.push({h,burst:()=>{ boost=1; },update(dt,t){ boost*=Math.exp(-dt*1.2); const tt=reduce?0:t;
    for(const f of list){ const a=tt*f.sp*(1+boost*2)+f.ph;
      f.g.position.set(c[0]+Math.cos(a)*f.r,c[1]+Math.sin(tt*1.3+f.ph)*o.bob,c[2]+Math.sin(a*(o.loop||1))*f.r);
      f.g.rotation.y=-a+(o.loop?0:-Math.PI/2)+Math.PI; const fl=o.flapBase+Math.abs(Math.sin(tt*o.flap+f.ph))*o.flapAmp;
      for(const [hinge,s] of f.wings) hinge.rotation.z=s*fl; } }}); }
// Paper planes: a folded dart that glides in loops around a point, nose first, banking into the turn.
function planes(h,c,n){ const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute([0,0,.36,-.2,.02,-.26,0,0,-.26, 0,0,.36,0,0,-.26,.2,.02,-.26, 0,0,.36,0,0,-.26,0,-.09,-.26],3)); geo.computeVertexNormals();
  const mat=std(0xffffff,{side:THREE.DoubleSide,flatShading:true}), list=[], nx=new V3();
  for(let i=0;i<n;i++){ const m=new THREE.Mesh(geo,mat); m.castShadow=true; m.scale.setScalar(1.8); h.group.add(m); list.push({m,ph:i*6.28/n+R(),r:2.6+i*.7,sp:(.55+R()*.2)*(i%2?-1:1),y:1.2+i*.9}); }
  let boost=0; const at=(f,a,o)=>o.set(c[0]+Math.cos(a)*f.r,c[1]+f.y+Math.sin(a*2+f.ph)*.5,c[2]+Math.sin(a)*f.r*.8);
  FX.push({h,burst:()=>{ boost=1; },update(dt,t){ boost*=Math.exp(-dt*1); if(!reduce) for(const f of list) f.ph+=dt*f.sp*(1+boost*2.5);
    for(const f of list){ at(f,f.ph,f.m.position); at(f,f.ph+Math.sign(f.sp)*.08,nx); h.group.localToWorld(nx); f.m.lookAt(nx); f.m.rotateZ(-Math.sign(f.sp)*.45); } }}); }
function sprouts(h,row){ const list=[];
  row.forEach((p,i)=>{ const g=new THREE.Group(); const leaf=new THREE.SphereGeometry(0.16,8,5);
    for(const s of [-1,1]){ const m=new THREE.Mesh(leaf,std(i%2?0x86d3b2:0x5fbf9a)); m.scale.set(1,.28,.55); m.position.set(s*.13,.2,0); m.rotation.z=s*.6; m.castShadow=true; g.add(m); }
    const st=new THREE.Mesh(new THREE.CylinderGeometry(.025,.03,.2,5),std(0x86d3b2)); st.position.y=.1; g.add(st);
    g.position.fromArray(p); g.rotation.y=i*1.3; h.group.add(g); list.push({g,ph:i/row.length}); });
  let boost=0;
  FX.push({h,burst:()=>{ boost=1; },update(dt,t){ boost*=Math.exp(-dt*.8);
    for(const s of list){ const c=reduce?.7:((t/8+s.ph)%1); let k=c<.55?c/.55:c<.85?1:(1-c)/.15; k=k*k*(3-2*k); s.g.scale.setScalar(Math.max(.001,k*(1+boost*.8+Math.sin(t*10+s.ph*9)*.06*boost))); } }}); }

const tgGeo=new THREE.BufferGeometry(); { const N=[0,0,.46],L=[-.34,.02,-.2],R=[.34,.02,-.2],C=[0,0,-.06],F=[0,-.13,-.16],G=[.12,-.05,-.12];

function orbiters(h,c,list,o){ let boost=0; const nx=new V3();
  list.forEach((m,i)=>{ h.group.add(m); m.userData.f={ph:i*6.28/list.length+R(),r:o.r*(.8+R()*.45),sp:(o.speed*(.8+R()*.4))*(i%2?-1:1),y:o.y0+R()*o.dy,spin:(R()-.5)*o.spin}; });
  FX.push({h,burst:()=>{ boost=1; },update(dt,t){ boost*=Math.exp(-dt*1); for(const m of list){ const f=m.userData.f; if(!reduce) f.ph+=dt*f.sp*(1+boost*2.5);
    const at=(a,out)=>out.set(c[0]+Math.cos(a)*f.r,c[1]+f.y+Math.sin(a*2+f.ph)*o.bob,c[2]+Math.sin(a)*f.r*.85);
    at(f.ph,m.position); if(o.face){ at(f.ph+Math.sign(f.sp)*.08,nx); h.group.localToWorld(nx); m.lookAt(nx); m.rotateZ(-Math.sign(f.sp)*.4); }
    else { m.rotation.x+=dt*f.spin*(1+boost*3); m.rotation.y+=dt*f.spin*.7*(1+boost*3); } } }}); }

document.querySelectorAll('[data-wx]').forEach(b=>b.addEventListener('click',()=>{ WX.mode=b.dataset.wx; document.querySelectorAll('[data-wx]').forEach(o=>o.setAttribute('aria-pressed',o===b)); }));

function weather(dt,t){

(async()=>{

addEventListener('resize',resize); resize();
let mx=0,my=0,pen=0,pin=false; addEventListener('pointermove',e=>{ mx=e.clientX/W-.5; my=e.clientY/H-.5; pin=true; pen=Math.min(1,pen+Math.hypot(e.movementX||0,e.movementY||0)*.012); });

main.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b){ act(+b.dataset.act); return; }
  if(e.target.closest('.card')) return; if(cur>=1&&cur<=HOUSES.length) act(cur-1); });

function station(k,out){
  if(k<=0||k>HOUSES.length){ out.t.set(-8,0,6); out.h=mobile?150:92; out.shift=0; return; }
  const h=HOUSES[k-1], sx=h.max[0]-h.min[0], sy=h.max[1]-h.min[1], sz=h.max[2]-h.min[2];
  out.t.set((h.min[0]+h.max[0])/2,h.min[1]+sy*0.4,(h.min[2]+h.max[2])/2);

const A={t:new THREE.Vector3(),h:1,shift:0}, B={t:new THREE.Vector3(),h:1,shift:0}, T=new THREE.Vector3(), ct=new THREE.Vector3();
