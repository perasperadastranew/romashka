<style>
/* Layout: a fixed isometric WebGL stage; text lives in one small card per screen (lower left),
   a pill row of the nine houses sits at the bottom. Single light look by choice. */
:root{
  color-scheme:light;
  --bg:#e9f0f1;
  --card:#ffffff;
  --ink:#1c211f;
  --dim:#6d7773;
  --line:#dfe5e3;
  --accent:#e4502f;
  --mint:#58b892;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(16px,3.2vw,44px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow-x:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
.bar{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gutter) 14px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.brand{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--card);background:var(--accent);padding:6px 12px;border-radius:8px}
#count{font-variant-numeric:tabular-nums;background:var(--card);padding:6px 12px;border-radius:999px;color:var(--ink)}
main{position:static}
section{min-height:100vh;min-height:100svh;padding-inline:var(--gutter);padding-block:88px 92px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
.card{background:var(--card);border-radius:14px;padding:22px 22px 20px;max-width:min(340px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line),0 18px 40px -22px rgba(28,33,31,.35)}
.card h1,.card h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.3vw,28px);line-height:1.12;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--dim);font-size:14px}
.num{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-variant-numeric:tabular-nums}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--dim);font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.state{font-family:var(--mono);font-size:11px;color:var(--dim)}
.state:empty{display:none}
.btn{align-self:flex-start;border:0;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--card);background:var(--accent);padding:8px 14px;border-radius:999px;text-decoration:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 var(--gutter) calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none}
.nav ol{list-style:none;margin:0;padding:6px;display:flex;gap:4px;overflow-x:auto;max-width:100%;width:max-content;background:var(--card);border-radius:999px;pointer-events:auto;box-shadow:0 12px 30px -18px rgba(28,33,31,.4);scrollbar-width:none}
.nav ol::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--dim);text-decoration:none;padding:7px 12px;border-radius:999px}
.nav a[aria-current="true"]{background:var(--accent);color:var(--card)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wx{display:flex;gap:2px;background:var(--card);border-radius:999px;padding:3px;margin-left:auto}
.wx button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--dim);background:transparent;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
.wx button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
#stage{filter:saturate(1.12) contrast(1.03)}
.ts{position:fixed;left:0;right:0;z-index:0;pointer-events:none;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.ts-top{top:0;height:30%;-webkit-mask-image:linear-gradient(to bottom,#000 10%,transparent);mask-image:linear-gradient(to bottom,#000 10%,transparent)}
.ts-bot{bottom:0;height:24%;-webkit-mask-image:linear-gradient(to top,#000 10%,transparent);mask-image:linear-gradient(to top,#000 10%,transparent)}
#wxc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.pins{position:fixed;inset:0;z-index:1;pointer-events:none}
.card{position:relative;z-index:2}
.pin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--ink);background:var(--card);border-radius:999px;padding:4px 10px 4px 4px;text-decoration:none;white-space:nowrap;box-shadow:0 8px 20px -12px rgba(28,33,31,.5);pointer-events:auto;will-change:transform}
.pin b{font-weight:400;color:var(--card);background:var(--accent);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pin::after{content:"";position:absolute;left:13px;top:100%;width:1px;height:14px;background:var(--accent)}
@media (max-width:760px){ .pin span{display:none} .pin{padding:4px}
 section{padding-block:76px 84px} .card{padding:18px} }
/* each lot pins its card for a while, the camera holds on the house, then moves on */
section{display:block;min-height:0;height:190vh;height:190svh;padding:0}
.pw{position:sticky;top:0;height:100vh;height:100svh;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:88px var(--gutter) 92px}
@media (max-width:760px){ .pw{padding:76px var(--gutter) 84px} }
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.card h1{font-family:var(--mono);font-weight:500;font-size:clamp(22px,2.2vw,28px);letter-spacing:-.03em;line-height:1.15}
.brand{display:inline-flex;align-items:center;gap:7px}
.brand .daisy{width:18px;height:18px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center}
.logo .daisy{width:38px;height:38px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 0;padding:0;list-style:none}
.facts li{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--ink);background:var(--bg);border-radius:999px;padding:5px 10px}
main{cursor:pointer}
.card{cursor:auto}
</style>

</head>

      <div class="num">9 лотов · сдан давно</div>
      <h1>Коттеджный посёлок «Ромашковая долина»</h1>

<script>
(function(){
const HOUSES=[{"file":"ForestHouse","short":"Шалаш","name":"Шалаш-студия в лесу","text":"Свободная планировка: стен нет, есть скаты. Мох на крыше входит в стоимость и растёт бесплатно.","meta":"Вид на звёзды · отделка: брёвна","btn":"Покрутить телескоп","min":[-99.87,-0.24,15.24],"max":[-87.74,7.42,30.15],"x":-93.8,"z":24.85,"y":0.0,"rot":0.4363,"parts":[{"id":"telescope","p":[-3.2,1.05,1.4],"ax":[0,1,0],"mode":"kick","a":0.5,"w":0.5}]},{"file":"PinkHouse","short":"Розовый","name":"Розовый дом с палисадником","text":"Видовое жильё в один этаж. Дым над трубой завивается сам, ромашка на двери крутится по требованию.","meta":"Двор без машин · забор по периметру","btn":"Крутануть ромашку","min":[-80.74,-0.2,-15.2],"max":[-68.01,5.6,-4.51],"x":-74.55,"z":-10.15,"y":0.0,"rot":0.3491,"parts":[{"id":"daisy","p":[0.0,1.061,1.758],"ax":[0,0,1],"mode":"spin","a":0.5,"w":0}]},{"file":"StoneHouse","short":"Каменный","name":"Каменный особняк","text":"Толстые стены и плющ вместо фасадной подсветки. Сердце на кронштейне служит единственной вывеской в посёлке.","meta":"Ручей у крыльца · шпили: 2 шт.","btn":"Качнуть сердце","min":[-47.84,-0.35,-55.25],"max":[-33.63,5.94,-46.15],"x":-39.55,"z":-50.4,"y":0.0,"rot":0.1745,"parts":[{"id":"heart","p":[1.908,3.48,-0.067],"ax":[1,0,0],"mode":"swing","a":0.22,"w":1.8}]},{"file":"TreeHouse","short":"На клёне","name":"Пентхаус на клёне","text":"Самый высокий этаж в долине. Лифта нет, зато есть лестница вверх и горка вниз.","meta":"Потолки до кроны · круговая терраса","btn":"Развернуть флаг","min":[43.35,-2.81,-76.02],"max":[52.46,8.08,-66.88],"x":47.95,"z":-71.4,"y":0.0,"rot":0.55,"parts":[{"id":"flag","p":[0.1,7.2,-0.0],"ax":[0,1,0],"mode":"kick","a":0.45,"w":0.9}]},{"file":"MillHouse","short":"Мельница","name":"Лофт в мельнице","text":"Бывшее производственное здание. Лопасти работают как вентиляция и как достопримечательность.","meta":"Центр долины · дощатый настил","btn":"Раскрутить лопасти","min":[1.04,-0.04,0.57],"max":[5.19,5.78,3.9],"x"   const lamps=all('lamp');
  inst(new THREE.CylinderGeometry(.035,.05,1.5,6),std(0x7d8792,{roughness:.5}),lamps,it=>{ P.set(it[0],it[1]+.75,it[2]); E.set(0,0,0); SC.setScalar(1); });
  inst(new THREE.SphereGeometry(.16,10,8),std(0xfff1c2,{emissive:0xffd98a,emissiveIntensity:.55,roughness:.3}),lamps,it=>{ P.set(it[0],it[1]+1.6,it[2]); E.set(0,0,0); SC.setScalar(1); },false);
  HOUSES.forEach((h,i)=>{ const s=PROPS[h.file].sign; if(!s) return;
    const t=tex(g=>{ g.canvas.width=256; g.canvas.height=128; g.fillStyle='#fff'; g.fillRect(0,0,256,128); g.fillStyle='#e4502f'; g.font='700 42px system-ui,Arial,sans-serif'; g.textAlign='center'; g.fillText('ПРОДАНО',128,66); g.fillStyle='#6d7773'; g.font='400 24px ui-monospace,Menlo,monospace'; g.fillText('лот '+String(i+1).padStart(2,'0'),128,104); });

}
// Weather: a mood for the light and a thin layer of rain or snow drawn over the scene.
const WX={mode:'sun',rain:0,snow:0}, wxc=document.getElementById('wxc'), wg=wxc.getContext('2d'), drops=[];
for(let i=0;i<260;i++) drops.push({x:R(),y:R(),s:.6+R()*.8,ph:R()*6.28});
document.querySelectorAll('[data-wx]').forEach(b=>b.addEventListener('click',()=>{ WX.mode=b.dataset.wx; document.querySelectorAll('[data-wx]').forEach(o=>o.setAttribute('aria-pressed',o===b)); }));
const hemiL=scene.children.find(o=>o.isHemisphereLight), CLR=new THREE.Color(), C_SUN=new THREE.Color(0xe9f0f1), C_RAIN=new THREE.Color(0xcfd8de), C_SNOW=new THREE.Color(0xeef3f7), W_SUN=new THREE.Color(0xbfe0ee), W_RAIN=new THREE.Color(0x9fbccc), W_SNOW=new THREE.Color(0xd4e6f0);
function weather(dt,t){
  const kr=1-Math.exp(-dt*1.6), ks=1-Math.exp(-dt*.7);
  WX.rain+=((WX.mode==='rain'?1:0)-WX.rain)*kr; WX.snow+=((WX.mode==='snow'?1:0)-WX.snow)*(WX.mode==='snow'?ks:kr);
  USNOW.value=WX.snow; UWET.value=WX.rain;
  sun.intensity=.74-.5*WX.rain-.22*WX.snow; hemiL.intensity=.52+.14*WX.rain+.1*WX.snow;
  CLR.copy(C_SUN).lerp(C_RAIN,WX.rain).lerp(C_SNOW,WX.snow); renderer.setClearColor(CLR,1);
  water.material.color.copy(W_SUN).lerp(W_RAIN,WX.rain).lerp(W_SNOW,WX.snow);
  for(const c of clouds) c.scale.setScalar(1+WX.rain*1.4+WX.snow*.6);
  const dpr=Math.min(window.devicePixelRatio||1,2); if(wxc.width!==Math.round(W*dpr)||wxc.height!==Math.round(H*dpr)){ wxc.width=Math.round(W*dpr); wxc.height=Math.round(H*dpr); }
  wg.setTransform(dpr,0,0,dpr,0,0); wg.clearRect(0,0,W,H);
  if(reduce||WX.rain+WX.snow<.02) return;
  if(WX.rain>.02){ wg.strokeStyle='rgba(120,145,170,'+(.5*WX.rain).toFixed(3)+')'; wg.lineWidth=1.2; wg.beginPath();
    for(const d of drops){ const y=((d.y+t*1.5*d.s)%1)*(H+60)-30, x=((d.x+y*.00022)%1)*(W+80)-40; wg.moveTo(x,y); wg.lineTo(x-4*d.s,y+18*d.s); } wg.stroke(); }
  if(WX.snow>.02){ wg.fillStyle='rgba(255,255,255,'+(.95*WX.snow).toFixed(3)+')'; wg.shadowColor='rgba(120,140,170,.45)'; wg.shadowBlur=3;
    for(const d of drops){ const y=((d.y+t*.09*d.s)%1)*(H+20)-10, x=((d.x+Math.sin(t*.8+d.ph)*.012)%1)*W; wg.beginPath(); wg.arc(x,y,1.3+d.s*1.6,0,6.3); wg.fill(); } wg.shadowBlur=0; }
}
(async()=>{
  const land=await get('land');
  if(land){ scene.add(land); loadEl.textContent='';
    // The valley repeats around itself, mirrored, so forest and mountains run past every edge of the screen.
    for(let ix=-2;ix<=2;ix++) for(let iz=-2;iz<=2;iz++){ if(!ix&&!iz) continue; const c=land.clone(); c.scale.set(ix%2?-1:1,1,iz%2?-1:1); c.position.set(ix*250,0,iz*220); scene.add(c); } } else loadEl.textContent='Генплан не загрузился.';
  for(let i=0;i<HOUSES.length;i++){ const h=HOUSES[i], st=document.querySelector('[data-h="'+i+'"]');
    const body=await get(h.file==='MillHouse'?'mill':h.file+'_body');
    if(!body){ st.textContent='Дом не загрузился.'; continue; }
    h.group.add(body);
    for(const p of h.parts){ const m=await get(p.id==='blades'?'blades':h.file+'_'+p.id); if(m){ m.position.fromArray(p.p).multiplyScalar(-1); p.pivot.add(m); } }

})();

let W=0,H=0,mobile=false;
function resize(){ W=window.innerWidth; H=window.innerHeight; mobile=W<=760; renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.setSize(W,H,false); }
addEventListener('resize',resize); resize();
let mx=0,my=0; addEventListener('pointermove',e=>{ mx=e.clientX/W-.5; my=e.clientY/H-.5; });

// Interaction: the button in a card, or a click anywhere on the scene, kicks the current house's moving parts
// and pulls the camera in on them for a moment.
let focus=null; const fv=new THREE.Vector3();
function act(i){ const h=HOUSES[i]; if(!h) return; h.hop=1;
  h.parts.forEach(p=>{ if(p.mode==='spin') p.vel+=14*Math.sign(p.a); else if(p.mode==='kick') p.vel+=11; else p.amp=1; });
  FX.forEach(f=>{ if(f.h===h) f.burst(6); });
  const p=h.parts[0]; focus={until:performance.now()+(window.__focusMs||2600),h:mobile?4.2:3.2,i,p}; }
main.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b){ act(+b.dataset.act); return; }
  if(e.target.closest('.card')) return; if(cur>=1&&cur<=HOUSES.length) act(cur-1); });

function station(k,out){
  if(k<=0||k>HOUSES.length){ out.t.set(-8,0,6); out.h=mobile?150:92; out.shift=0; return; }
  const h=HOUSES[k-1], sx=h.max[0]-h.min[0], sy=h.max[1]-h.min[1], sz=h.max[2]-h.min[2];
  out.t.set((h.min[0]+h.max[0])/2,h.min[1]+sy*0.4,(h.min[2]+h.max[2])/2);
  out.h=Math.max(sx,sz,sy*1.2)*(mobile?1.25:0.72)+2.5; out.shift=1;
}
const A={t:new THREE.Vector3(),h:1,shift:0}, B={t:new THREE.Vector3(),h:1,shift:0}, T=new THREE.Vector3(), ct=new THREE.Vector3();
let ch=100, first=true, last=performance.now(), shiftS=0, px=0, py=0, cur=-1, t0=last, lastU=0;
function frame(now){
  const dt=Math.min(.5,(now-last)/1000); last=now; const k1=window.__snap?1:1-Math.exp(-dt*6), k2=1-Math.exp(-dt*3), t=(now-t0)/1000;
  const mid=H/2; let best=0,bd=1e9,tt=0;
  for(let i=0;i<N;i++){ const r=sections[i].getBoundingClientRect(); const d=(r.top+r.height/2-mid)/r.height; if(Math.abs(d)<bd){bd=Math.abs(d);best=i;tt=d;} }
  let u=Math.min(N-1,Math.max(0,best-tt));
  { u=N-1;
    for(let j=0;j<N;j++){ const r=sections[j].getBoundingClientRect(), ph=sections[j].firstElementChild.offsetHeight||H, pin=Math.max(0,r.height-ph);
      if(r.bottom>0){ u=j+Math.min(1,Math.max(0,(-r.top-pin)/ph)); if(r.top>0&&j>0) u=j-1+Math.min(1,Math.max(0,1-r.top/ph)); break; } }
    u=Math.min(N-1,Math.max(0,u)); }
  const i=Math.min(N-2,Math.floor(u)), f=u-i;
  let e=Math.min(1,Math.max(0,(f-.08)/.84)); e=e*e*e*(e*(e*6-15)+10);
  station(i,A); station(i+1,B);
  T.lerpVectors(A.t,B.t,e);
  const hop=A.t.distanceTo(B.t), arc=Math.sin(Math.PI*e)*(A.shift&&B.shift?1:0);
  let hh=Math.exp(Math.log(A.h)+(Math.log(B.h)-Math.log(A.h))*e); hh*=1+arc*Math.min(1.6,hop/70);
  let shift=A.shift+(B.shift-A.shift)*e;
  if(focus){ if(now>focus.until||Math.abs(u-lastU)>0.004&&now>focus.until-2200||Math.round(u)!==focus.i+1) focus=null;
    else { focus.p.pivot.getWorldPosition(fv); T.copy(fv); hh=focus.h; } }
  lastU=u;
  if(first){ ct.copy(T); ch=hh; first=false; } else { ct.lerp(T,k1); ch+=(hh-ch)*k1; }
  shiftS+=(shift-shiftS)*k1; px+=(mx-px)*k2; py+=(my-py)*k2;
  const asp=W/H;
  camera.left=-ch*asp; camera.right=ch*asp; camera.top=ch; camera.bottom=-ch;
  camera.position.copy(ct).addScaledVector(DIR,500); camera.lookAt(ct);
  camera.translateX(-px*ch*0.08); camera.translateY(py*ch*0.08);
  if(mobile) camera.setViewOffset(W,H,0,H*(0.2-0.04*shiftS),W,H); else camera.setViewOffset(W,H,-W*0.12*shiftS,0,W,H);
  camera.updateProjectionMatrix(); UPX.value=2*ch/H;
  const ext=ch*Math.max(asp,1)*1.5+20, sc=sun.shadow.camera;
  sun.target.position.copy(ct); sun.position.copy(ct).addScaledVector(SUN,400);
  sc.left=-ext; sc.right=ext; sc.top=ext; sc.bottom=-ext; sc.near=50; sc.far=900; sc.updateProjectionMatrix();
  sun.shadow.normalBias=ext/400;
  for(const h of HOUSES){
    h.hop*=Math.exp(-dt*3.2); const sq=1+Math.sin(t*14)*0.05*h.hop; h.group.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
    for(const p of h.parts){

      const idle=reduce?0:1;
      if(p.mode==='spin'){ p.ang+=(p.a*idle+p.vel)*dt; p.pivot.setRotationFromAxisAngle(p.axis,p.ang); }
      else if(p.mode==='kick'){ p.ang+=p.vel*dt; p.pivot.setRotationFromAxisAngle(p.axis,p.ang+Math.sin(t*p.w)*p.a*idle); }
      else if(p.mode==='swing'){ p.pivot.setRotationFromAxisAngle(p.axis,Math.sin(t*p.w*(1+p.amp*.6))*p.a*(idle+p.amp*3.2)); }
      else { p.pivot.position.y=p.p[1]+Math.max(0,Math.sin(t*p.w*(1+p.amp)))*p.a*(idle+p.amp*4); }
    }
  }

  const pv=1-Math.min(1,Math.max(0,(shiftS-.15)/.35));
  for(const h of HOUSES){ fv.set((h.min[0]+h.max[0])/2,h.max[1]+1,(h.min[2]+h.max[2])/2).project(camera);
    const sx=(fv.x*.5+.5)*W, sy=(-fv.y*.5+.5)*H; h.pin.style.transform='translate('+(sx-14).toFixed(1)+'px,'+(sy-42).toFixed(1)+'px)'; h.pin.style.opacity=pv; h.pin.style.visibility=pv<.02?'hidden':'visible'; }
  if(!reduce) for(const c of clouds){ c.position.x+=c.userData.v*dt; if(c.position.x>190) c.position.x=-190; }
  const idx=Math.round(u), on=idx>=1&&idx<=HOUSES.length;
  if(idx!==cur){ cur=idx; countEl.textContent='Лот '+(on?String(idx).padStart(2,'0'):'00')+' / 09';
    navLinks.forEach((a,j)=>{ if(j===idx-1) a.setAttribute('aria-current','true'); else a.removeAttribute('aria-current'); }); }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__act=act;
})();
